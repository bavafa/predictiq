[project]
name = "predictiq"
version = "0.1.0"
description = "PredictIQ: portfolio demo from machine failure predictions to maintenance decisions (historical sample data)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies of the data service only. No model libraries (decision 32).
dependencies = [
    "fastapi==0.162.5",
    "pydantic==2.14.3",
    # Reads the serving bundle (arrays only; no model libraries at runtime).
    "numpy==2.5.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy",
    "pip-audit",
    "pytest",
    "ruff",
    "uvicorn",
]
ml = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pandas-stubs>=3.1.0.261029",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests", "scripts/tests"]
pythonpath = [".", "backend"]
addopts = "-ra --strict-markers -m 'not realdata and not realbundle'"
markers = [
    "realdata: needs the downloaded files in data/raw (opt-in: run with -m realdata; skipped when they are missing)",
    "realbundle: needs the real serving bundle in artifacts/<version>/bundle (opt-in: run with -m realbundle; skipped when it is missing)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "ml", "scripts"]
explicit_package_bases = true
mypy_path = "backend:."
exclude = ["frontend/"]
